<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#79b84a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Watson Writes">
<meta name="description" content="Learn to write letters and numbers the Print Rhythm Leader way.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Watson's Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: one full-height play surface. A menu of three chunky game cards opens a single-purpose game under a slim top bar. Single bright daytime look, chosen on purpose for a kids' game. */
:root {
  --sky: #bfe3f2;
  --sky-deep: #8fcbe6;
  --grass: #79b84a;
  --grass-dark: #5e9a35;
  --soil: #7a4e32;
  --barn: #c4402f;
  --sun: #ffc533;
  --ink: #2a2118;
  --paper: #fff8e6;
  --belt: #4a4540;
  --display: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 600;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app {
  height: 100%;
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.01em;
  color: var(--barn);
  text-shadow: 0 2px 0 var(--paper);
}
.grow { flex: 1; }
.btn {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  min-height: 46px;
  padding: 6px 16px;
  color: var(--ink);
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.quiet { background: var(--paper); }
.stars {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 14px;
}
.stars .s { color: #e0a000; }
.stars.bump { animation: bump 0.5s ease; }
@keyframes bump { 40% { transform: scale(1.25) rotate(-4deg); } }
button:focus-visible, input:focus-visible { outline: 4px solid #1c6fd1; outline-offset: 2px; }

.menu { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.menu > * { flex: none; }
#hero { display: block; width: 100%; height: 140px; border: 3px solid var(--ink); border-radius: 18px; background: var(--sky-deep); flex: none; }
.name { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--display); font-size: 18px; }
.name input {
  flex: 1;
  min-width: 140px;
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
  min-height: 46px;
  padding: 4px 14px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
}
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card {
  text-align: left;
  font: inherit;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px;
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  cursor: pointer;
}
.card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card b { font-family: var(--display); font-size: 24px; font-weight: 700; }
.card span { font-size: 16px; line-height: 1.3; font-weight: 700; }
.card svg { width: 64px; height: 52px; }
.card.haul { background: #ffd966; }
.card.plow { background: #a6d96a; }
.card.sort { background: #f4a58f; }
.grown { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-size: 15px; }
.grown summary { font-family: var(--display); font-size: 17px; font-weight: 600; cursor: pointer; min-height: 32px; }
.grown p { margin: 8px 0 0; line-height: 1.35; }
.grownRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.grownRow select { flex: 1; min-width: 160px; min-height: 44px; font-size: 16px; font-family: var(--body); font-weight: 600; padding: 4px 8px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
.grownRow .btn { min-height: 44px; font-size: 16px; }
.fine { margin: 0; font-size: 14px; opacity: 0.8; }

.game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.prompt {
  font-family: var(--display);
  font-weight: 700;
  font-size: 28px;
  text-align: center;
  min-height: 42px;
  line-height: 1.2;
  text-wrap: balance;
}
.prompt .n { color: var(--barn); font-size: 36px; }
.prompt .pic { display: inline-block; font-size: 54px; line-height: 1; margin-right: 10px; vertical-align: middle; }
.prompt .ch { display: inline-block; min-width: 1.1em; margin: 0 3px; padding: 0 4px; border-bottom: 5px solid var(--ink); opacity: 0.35; }
.prompt .ch.on { opacity: 1; color: var(--barn); border-bottom-color: var(--barn); animation: pop 0.3s ease; }
@keyframes pop { 50% { transform: scale(1.35); } }
.stage { position: relative; flex: 1; min-height: 0; }
#cv {
  display: block;
  width: 100%;
  height: 100%;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: var(--sky);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.toast {
  position: absolute;
  left: 50%;
  top: 52px;
  transform: translateX(-50%);
  max-width: 92%;
  text-align: center;
  font-family: var(--display);
  font-weight: 600;
  font-size: 22px;
  padding: 8px 20px;
  color: var(--paper);
  background: var(--ink);
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 5;
}
.toast.on { opacity: 1; }

.sortpanel {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  background: var(--grass);
  border: 3px solid var(--ink);
  border-radius: 18px;
}
.animalWrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.animal {
  width: 1.4em;
  height: 1.4em;
  display: grid;
  place-items: center;
  font-size: clamp(64px, 17vh, 118px);
  line-height: 1;
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 50%;
  box-shadow: 0 6px 0 var(--ink);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  z-index: 3;
  transition: transform 0.25s;
}
.animal.lift { cursor: grabbing; }
.homes { flex: 0 0 46%; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.zone {
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--paper);
  border: 3px dashed var(--ink);
  border-radius: 16px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
  padding: 4px;
}
.zone svg { width: min(70%, 110px); max-height: 60%; height: auto; }
.zone.over { background: #fff0a8; border-style: solid; }
.zone.hint { animation: glow 0.6s ease 3; }
.zone.shake { animation: shake 0.35s; }
@keyframes glow { 50% { background: #ffe066; transform: scale(1.04); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.lives { position: absolute; left: 12px; top: 8px; z-index: 4; display: flex; gap: 4px; font-size: 32px; line-height: 1; pointer-events: none; text-shadow: 0 2px 0 var(--paper); }
.lives span { color: var(--barn); }
.lives span.off { color: #b9b3a8; }
.lives.hit { animation: shake 0.35s; }
.banner {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  display: grid;
  place-items: center;
  padding: 0 12px;
  text-align: center;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(46px, 15vw, 90px);
  line-height: 1.05;
  color: var(--sun);
  -webkit-text-stroke: 8px var(--ink);
  paint-order: stroke fill;
  text-wrap: balance;
  opacity: 0;
  pointer-events: none;
  z-index: 7;
}
.banner.on { animation: hooray 1.5s ease forwards; }
@keyframes hooray {
  0% { opacity: 0; transform: scale(0.4) rotate(-6deg); }
  15% { opacity: 1; transform: scale(1.15) rotate(3deg); }
  30% { transform: scale(1) rotate(0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.05); }
}
@keyframes fadeOnly { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.over { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; background: rgba(42, 33, 24, 0.55); border-radius: 18px; z-index: 8; }
.overCard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 30px; text-align: center; background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); }
.overCard b { font-family: var(--display); font-size: 42px; font-weight: 700; color: var(--barn); }
.overCard span { font-family: var(--display); font-size: 24px; font-weight: 600; }
.overCard .btn { margin-top: 12px; font-size: 30px; min-height: 62px; padding: 6px 42px; }
.card.c-ttt { background: #a9dcf2; }
.card.c-cbn { background: #f7c27b; }
.card.c-tube { background: #d7c2f0; }
.card.c-book { background: #f9d1de; }
.card.c-farm { background: #c9e58f; text-decoration: none; }
.card.c-write { background: #ffe9a8; }
#write { gap: 8px; }
.wmenu, .wpick { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.wmenu .btn { font-size: 26px; min-height: 84px; }
.wnote { margin: 14px 0 0; font-size: 12px; line-height: 1.4; color: #8a7663; text-align: center; overflow-wrap: break-word; }
.wtabs { display: flex; gap: 8px; }
.wtabs .btn { flex: 1; font-size: 16px; min-height: 76px; padding: 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.btn b { font-weight: 700; }
.ex { display: flex; gap: 6px; font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.ex i { font-style: normal; }
.ex .r { color: #d93b32; } .ex .g { color: #2a9a3f; } .ex .b { color: #2f74d0; }
.wsets .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.wsets .ex { font-size: 30px; }
#wHint { position: relative; }
#wHint.glow { animation: hglow 0.9s ease-in-out infinite; background: var(--sun, #ffc533); z-index: 5; }
#wHint.glow::after { content: "Need a hint?"; position: absolute; bottom: calc(100% + 10px); left: 0; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-size: 18px; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
@keyframes hglow { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,197,51,.9); } 50% { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(255,197,51,0); } }
.wtabs .btn { background: #fff; }
.wtabs .btn.on { background: #ffe08a; outline: 4px solid var(--ink); outline-offset: -2px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.wl { font: inherit; font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; padding: 6px 2px 4px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.wl:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.wl i { font-style: normal; font-size: 12px; color: #c98a00; letter-spacing: 1px; }
.wsets { display: flex; flex-direction: column; gap: 10px; }
.wsets .btn { font-size: 24px; min-height: 72px; }
.wplay { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
.wcap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.wstep { font-family: var(--display); font-weight: 700; font-size: 18px; padding: 3px 12px; border-radius: 999px; background: var(--paper); border: 3px solid var(--c, var(--ink)); color: var(--ink); opacity: 0.6; }
.wstep.on { opacity: 1; background: var(--c); color: #fff; transform: scale(1.08); }
.wstep.done { opacity: 0.9; }
.wq { font-family: var(--display); font-weight: 600; font-size: 18px; }
.wbig { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; margin-left: 8px; }
.wwrap { flex: 1; min-height: 0; background: #fffdf2; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; position: relative; touch-action: none; }
#wcv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
.wbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.wbar .btn { font-size: 17px; min-height: 48px; padding: 4px 10px; white-space: nowrap; flex: 1; }
.wbar .wpts { order: -1; flex: 1 0 100%; text-align: center; font-family: var(--display); font-weight: 700; font-size: 18px; min-height: 22px; }
.wbar .wpts:empty { display: none; }
.wover, .whp { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; background: rgba(42, 33, 24, 0.6); border-radius: 12px; }
.wover[hidden], .whp[hidden] { display: none; }
.wover b { font-family: var(--display); font-size: 36px; color: #fff; }
.wover .st { font-size: 48px; color: #ffc533; letter-spacing: 6px; }
.wover span { font-family: var(--display); font-size: 22px; color: #fff; }
.wover .btn { min-width: 220px; font-size: 22px; min-height: 56px; }
.whp .wgrid { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px; max-height: 55%; overflow-y: auto; width: 100%; }
.whp h3 { margin: 0; font-family: var(--display); color: #fff; font-size: 22px; }
.panel { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: var(--grass); border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; }
.pc { display: inline-grid; place-items: center; line-height: 1; vertical-align: middle; }
.pc svg { width: 100%; height: 100%; display: block; }
.pc.sm { width: 1.25em; height: 1.25em; font-size: 0.9em; }
.tsetup { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.tsetup h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.choices.modes { grid-template-columns: 1fr; }
.modebtn { font-size: 26px; min-height: 84px; }
.tile { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tile:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
.tile .pc { width: 68px; height: 54px; font-size: 44px; }
.tile .nm { font-family: var(--display); font-size: 14px; font-weight: 600; text-align: center; line-height: 1.1; }
.tplay { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.twrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.tboard { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
.cell { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 4px; font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.cell:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.cell .pc { width: 100%; height: 100%; font-size: 1em; }
.cell .pc.pl { animation: pop 0.3s ease; }
.cell.win { background: #ffe066; animation: glow 0.6s ease 3; }
.tscore { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 24px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; align-self: center; }
.tscore .pc { width: 40px; height: 34px; font-size: 28px; }
.tscore .gap { width: 22px; }
.tbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.cpick { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; align-content: start; }
.pcard { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.pcard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.pcard svg { width: 100%; height: 92px; }
.pcard span { font-family: var(--display); font-size: 17px; font-weight: 600; }
.cwork { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.cbar { display: flex; gap: 10px; justify-content: space-between; }
.cart { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; }
.cart svg { width: 100%; height: 100%; }
.r { cursor: pointer; transition: fill 0.25s; }
.r.done { cursor: default; }
.r.fillpop { animation: rpop 0.35s ease; transform-box: fill-box; transform-origin: center; }
@keyframes rpop { 40% { transform: scale(1.06); } }
.fx { pointer-events: none; }
.lbl { font-family: var(--display); font-weight: 700; fill: var(--ink); pointer-events: none; user-select: none; -webkit-user-select: none; }
.cpal { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.sw { width: 56px; height: 56px; font-family: var(--display); font-size: 24px; font-weight: 700; border: 3px solid var(--ink); border-radius: 50%; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.sw:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.sw.sel { outline: 4px solid #1c6fd1; outline-offset: 3px; transform: scale(1.1); }
.sw.fin { opacity: 0.4; }
.sw.nudge { animation: glow 0.6s ease 2; }
.tbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tlevel { font-family: var(--display); font-weight: 700; font-size: 22px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px; }
.tubes { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 22px 12px; justify-content: center; align-content: center; padding: 22px 6px 8px; }
.tube { width: 54px; height: 190px; padding: 4px; display: flex; flex-direction: column-reverse; gap: 3px; background: rgba(255, 255, 255, 0.6); border: 4px solid var(--ink); border-radius: 10px 10px 28px 28px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; transition: transform 0.15s; font: inherit; }
.tubes.mid .tube { width: 46px; height: 160px; }
.tubes.dense .tube { width: 38px; height: 140px; padding: 3px; }
.tube.sel { transform: translateY(-16px); outline: 4px solid #1c6fd1; outline-offset: 3px; }
.tube.full { background: rgba(255, 244, 168, 0.85); }
.blob { display: block; flex: none; height: calc((100% - 9px) / 4); border: 2px solid var(--ink); border-radius: 8px; }
.blob:first-child { border-radius: 8px 8px 20px 20px; }
.cpal .sw.plain { font-size: 0; }
.cf { position: absolute; width: 10px; height: 10px; z-index: 6; pointer-events: none; animation: cf 1.5s cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }

    if (current !== farm || !e.target.closest) return;
    audio();
    if (e.target === this || e.target.closest('.fx-close')) { fCloseSheet(); return; }
    var b = e.target.closest('.ft'); if (!b) return;
    var k = b.getAttribute('data-k');
    if (fSheetKind === 'pick') fAdopt(k); else if (fSheetKind === 'decor') fDecor(b, k); else if (fSheetKind === 'build') fBuyItem(b, k);
  });
  $('#fBack').addEventListener('click', function () { if (current !== farm) return; audio(); sfx.pop(); farmClose(); });
  $('#fHammer').addEventListener('click', function () {   /* first tap: build mode and the shop; tap again to stop building */
    if (current !== farm) return; audio(); sfx.pop();
    if (fBuildOn) fBuildMode(false); else { fBuildMode(true); fSheet('build'); }
  });
  $('#fPaint').addEventListener('click', function () { if (current !== farm || !fSel) return; audio(); sfx.pop(); fSheet('decor'); });
  window.addEventListener('resize', function () { if (current === farm) { fMeasure(); fLayout(); } });
  FST = fLoad(); renderStars();

  /* ---------- screens ---------- */
  var current = write;
  function closeGame() { wMenu(); }
  $('#mute').addEventListener('click', function () {
    muted = !muted; this.textContent = 'Sound: ' + (muted ? 'off' : 'on'); this.setAttribute('aria-pressed', String(muted));
    if (muted) { vstop(); } else audio();
  });
  loadVoices();
  try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
  $('#startBtn').addEventListener('click', function () {
    audio(); $('#gate').hidden = true; write.start();
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
